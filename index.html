<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Americano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#F7F6F2; --surface:#FFFFFF; --ink:#14233F; --muted:#5C6678; --border:#E2E0D9;
  --turf:#2A5DB0; --turf-deep:#1B437F; --line:rgba(255,255,255,.55); --hero:#2A5DB0;
  --ball:#F2D43D; --ball-ink:#2A2200; --boy:#2A5DB0; --girl:#B8416F; --danger:#B3261E;
  --logo-ink:#14233F; --logo-ball:#F2D43D;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1729; --surface:#15233B; --ink:#E5EBF5; --muted:#93A3BD; --border:#26395C;
    --turf:#2A589F; --turf-deep:#1A3A6E; --hero:#2A589F; --boy:#7DA4EC; --girl:#E57BA3; --danger:#F2867E;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1729; --surface:#15233B; --ink:#E5EBF5; --muted:#93A3BD; --border:#26395C;
    --turf:#2A589F; --turf-deep:#1A3A6E; --hero:#2A589F; --boy:#7DA4EC; --girl:#E57BA3; --danger:#F2867E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.ball{width:18px;height:18px;border-radius:50%;background:var(--ball);flex:none;position:relative;overflow:hidden}
.ball::before{content:"";position:absolute;inset:-4px 7px -4px -9px;border:2px solid rgba(255,255,255,.85);border-radius:50%}
.rules-btn{margin-left:auto;font-family:var(--display);font-weight:700;font-size:22px}
.rules-btn + .icon-btn{margin-left:6px}
.back-btn{flex:none;width:34px;height:40px;margin-left:-8px;margin-right:-4px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.back-btn[hidden],.ball[hidden]{display:none}
.icon-btn{margin-left:auto;flex:none;width:42px;height:42px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center}
.share-text{width:100%;min-height:150px;border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:12px;font:inherit;font-size:15px;resize:vertical}
.top h1{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:clamp(19px,5.6vw,24px);margin:0;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{max-width:560px;margin:0 auto;padding:16px 16px 110px}
section{margin-bottom:26px}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}

.field{display:block;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);min-height:48px}
.row{display:flex;gap:8px;align-items:center}
.row > .field{flex:1;min-width:0}

.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex:none;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 14px;min-height:46px;font-weight:600}
.seg button[aria-pressed="true"].b{background:var(--boy);color:#fff}
.seg button[aria-pressed="true"].f{background:var(--girl);color:#fff}

.btn{border:0;border-radius:10px;min-height:48px;padding:0 18px;font-weight:600;background:var(--turf);color:#fff}
.btn.ball-btn{background:var(--ball);color:var(--ball-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--border)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:0 16px;min-height:42px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.players{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.player{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px 4px 4px 12px;min-height:50px}
.player .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.gtag{flex:none;width:36px;height:36px;border-radius:8px;border:0;font-weight:700;color:#fff}
.gtag.b{background:var(--boy)} .gtag.f{background:var(--girl)}
.gtag.locked{background:var(--muted)}
.x{border:0;background:transparent;width:40px;height:40px;border-radius:8px;font-size:22px;color:var(--muted)}
.dice{flex:none;padding:0 14px;font-size:20px}
.sugg .chips{margin-top:10px}
.seg-wrap{position:relative;flex:none}
.tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);white-space:nowrap;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:2}
.tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.row:focus-within .tip,.seg-wrap:hover .tip{opacity:1;transform:translate(-50%,0)}
.sugg .chip,.pickc{display:inline-flex;align-items:center;gap:7px;font-weight:500}
.player .nm small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.pick-hint{margin:12px 0 10px;font-size:15px}
.pickc[aria-pressed="true"]{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
.pickc[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--ball-ink)}
.counts{margin-top:10px;font-size:14px;color:var(--muted)}

.fixed-list{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.fixed-list li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--turf);border-radius:10px;padding:4px 4px 4px 12px;min-height:50px;font-weight:500}
.fixed-list li span{flex:1}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}

.courts-in{display:grid;gap:8px}

.check{border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--surface);border:1px solid var(--border)}
.check.bad{border-color:var(--danger)}
.check p{margin:0}
.check p + p{margin-top:6px}
.check .err{color:var(--danger)}
.summary{font-family:var(--display);font-size:22px;font-weight:600}

.banner{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--ball);border-radius:10px;padding:14px 16px;margin-bottom:22px}
.banner p{margin:0 0 10px}
.banner .row{flex-wrap:wrap}

/* Rounds */
.round-strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 8px;scrollbar-width:none}
.round-strip::-webkit-scrollbar{display:none}
.rchip{flex:none;min-width:48px;min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-family:var(--display);font-weight:700;font-size:19px;position:relative}
.rchip[aria-current="true"]{background:var(--turf);color:#fff;border-color:var(--turf)}
.rchip.done::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--ball)}
.finish{background:var(--surface);border-radius:14px;padding:18px 16px;margin:4px 0 12px;text-align:center;box-shadow:0 1px 3px rgba(10,25,50,.10),0 8px 22px rgba(10,25,50,.12)}
.finish-t{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 12px}
.round-sec{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px);margin-bottom:22px}
.round-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.round-head h2{margin:0;font-size:24px}

.match{display:block;width:100%;border:0;padding:0;background:transparent;text-align:left;margin-bottom:16px}
.court-label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:0 2px 6px;font-weight:500}
.court-label b{color:var(--ink);font-weight:600}
.court{position:relative;display:grid;grid-template-columns:1fr 4px 1fr;background:var(--turf);border:3px solid var(--turf-deep);border-radius:12px;overflow:hidden;min-height:118px;color:#fff}
.net{background:rgba(255,255,255,.9)}
.half{display:grid;grid-template-rows:1fr 1fr}
.half.a{grid-template-columns:22% 78%}
.half.b{grid-template-columns:78% 22%}
.box{display:flex;align-items:center;padding:8px 10px;min-width:0;font-weight:600;font-size:15px;line-height:1.2}
.box span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.half.a .box{grid-column:2;border-left:2px solid var(--line)}
.half.b .box{grid-column:1;border-right:2px solid var(--line);justify-content:flex-end;text-align:right}
.half .box:first-of-type{border-bottom:1px solid var(--line)}
.half .box:last-of-type{border-top:1px solid var(--line)}
.half.a .box{padding-right:34px}
.half.b .box{padding-left:34px}
.half.won{background:rgba(255,255,255,.1)}
.half.lost .box{opacity:.72}
.score{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ball);color:var(--ball-ink);font-family:var(--display);font-weight:700;font-size:22px;line-height:1;padding:8px 10px;border-radius:999px;min-width:44px;text-align:center;box-shadow:0 0 0 3px var(--turf)}
.score.empty{background:var(--turf-deep);color:#fff;font-size:15px;font-family:var(--body);font-weight:600;padding:8px 12px}
.round-nav{display:flex;gap:8px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:9;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateY(20px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--ball);font-weight:700;padding:10px 12px;border-radius:8px}
.hosted-badge .toast{bottom:calc(136px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@keyframes shufIn{0%{opacity:0;transform:translateY(10px) scale(.97)}100%{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.match.shuf{animation:shufIn .25s ease-out both;animation-delay:calc(var(--d,0ms) / 2)}
.shuffle-btn{transition:background .2s,color .2s,border-color .2s}
.shuffle-btn:active{transform:scale(.97)}
@keyframes flash{0%{background:var(--turf);color:#fff;border-color:var(--turf)}100%{background:transparent}}
.shuffle-btn.done{animation:flash .5s ease-out}
.shuffle-btn.done svg{animation:spin .45s ease-out}
@media (prefers-reduced-motion: reduce){.match.shuf,.shuffle-btn.done svg{animation:none}}
.shuffle-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 12px}
.round-nav .btn{flex:1}

/* Leaderboard */
.progress{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin:8px 0 18px}
.progress i{display:block;height:100%;background:var(--ball)}
.board{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.board li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.board li:first-child{border-color:var(--ball);border-width:2px}
.rank{font-family:var(--display);font-weight:700;font-size:22px;color:var(--muted)}
.board li:first-child .rank{color:var(--ink)}
.who{min-width:0}
.who .nm{font-weight:600;display:flex;align-items:center;gap:7px}
.who .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.b{background:var(--boy)} .dot.f{background:var(--girl)}
.who .st{font-size:13px;color:var(--muted)}
.pts{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}

/* Tabs */
.tabs[hidden]{display:none}
.hosted-badge .tabs{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
.hosted-badge main{padding-bottom:170px}
.hosted-badge .panel{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px) + 64px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:transparent;min-height:58px;font-weight:600;font-size:15px;color:var(--muted);position:relative}
.tabs button[aria-current="true"]{color:var(--ink)}
.tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--ball);border-radius:0 0 3px 3px}

/* Score sheet */
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(5,12,25,.55);border:0}
.panel{position:relative;width:100%;max-width:560px;background:var(--surface);border-radius:18px 18px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.panel{animation:none}}
.panel h3{font-family:var(--display);font-size:24px;margin:0 0 14px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.side{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.side .names{font-weight:600;line-height:1.3;min-height:42px;overflow-wrap:anywhere}
.stepper{display:grid;grid-template-columns:40px 1fr 40px;gap:4px;align-items:center}
.stepper button{height:44px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-size:22px;font-weight:600}
.stepper input{width:100%;height:56px;text-align:center;font-family:var(--display);font-weight:700;font-size:34px;border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.panel .hint{font-size:14px;color:var(--muted);margin:12px 0 14px}
.sides + .actions{margin-top:16px}
.panel .actions{display:grid;gap:8px}
.board li.hist{cursor:pointer}
.board li.hist .rank{font-size:20px}
.panel.rules{max-height:88vh;overflow-y:auto}
.rules h4{font-family:var(--display);font-size:20px;margin:18px 0 6px}
.rules p,.rules li{margin:0 0 8px;line-height:1.5}
.rules ol{margin:0 0 8px;padding-left:20px}
.rules .ex{background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0 10px;font-size:15px}
.link-btn{border:0;background:transparent;color:var(--turf);font-weight:600;padding:12px 0;text-decoration:underline;text-underline-offset:3px}
.hero{margin:-16px -16px 18px;background:var(--hero);display:flex;justify-content:center;padding:22px 0 12px}
.logo-svg{width:190px;height:auto;display:block}
.home-title{font-size:30px;margin:6px 0 16px;text-align:center}
.fmt-card{display:block;width:100%;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:0;overflow:hidden;margin-bottom:18px;box-shadow:0 1px 3px rgba(10,25,50,.10),0 8px 22px rgba(10,25,50,.12)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .fmt-card{box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 10px 26px rgba(0,0,0,.45)} }
:root[data-theme="dark"] .fmt-card{box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 10px 26px rgba(0,0,0,.45)}
.fmt-card:hover{box-shadow:0 2px 4px rgba(10,25,50,.12),0 12px 28px rgba(10,25,50,.16)}
.fmt-card:active{transform:scale(.99)}
.fmt-body{display:block;padding:18px 18px 22px}
.fmt-name{display:block;font-family:var(--display);font-weight:700;font-size:25px;line-height:1.1;margin-bottom:6px}
.fmt-desc{display:block;color:var(--muted);font-size:15px}
.fmt-now{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.fmt-now .link-btn{padding:6px 0}
.empty-state{text-align:center;padding:40px 10px}
</style>
</head>
<body>
<header class="top"><button class="back-btn" id="back-btn" data-action="back" aria-label="Înapoi la alegerea formatului" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><button class="back-btn" id="exit-btn" data-action="exit" aria-label="Ieși din turneu" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span class="ball" id="brand-ball" aria-hidden="true"></span><h1 id="title">Americano</h1><button class="icon-btn rules-btn" data-action="rules" aria-label="Regulament">?</button><button class="icon-btn" data-action="share" aria-label="Distribuie"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button></header>
<main id="app"></main>
<nav class="tabs" id="tabs" hidden>
  <button data-action="view" data-v="setup">Jucători</button>
  <button data-action="view" data-v="rounds">Program</button>
  <button data-action="view" data-v="board">Clasament</button>
</nav>
<div class="sheet" id="sheet" hidden></div>

<script id="app-js">
(function(){
try { if(/netlify\.app$/i.test(location.hostname)) document.documentElement.classList.add('hosted-badge'); } catch(e){}
const KEY = 'americano-mixt-v1';
const defaults = {mode:'mixed', roster:[], fixed:[], courts:[], points:4, customPts:false, name:'', newG:'B', tour:null, view:'home', round:0};
let S = Object.assign({}, defaults, load() || {});
if(S.mode !== 'open') S.mode = 'mixed';
let jumpToOpen = true;
delete S.history; delete S.histId; if(S.view==='history') S.view='setup';
if(!S.tour && S.view==='setup' && !S.roster.length) S.view='home';
if(!S.ptsV2){ S.points = 4; S.customPts = false; S.ptsV2 = true; }
const FRIENDS = [['Lavinia','F'],['Diana','F'],['Cristiana','F'],['Stef',null],['Costin','B'],['Ionuț','B'],['Mihnea','B'],['Edi','B'],['Bogdan','B'],['Ana','F'],['Răzvan','B'],['Georgiana','F'],['Alin','B'],['Luci','B'],['Alex','B'],['Vlad','B']];
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
let fixPick = null;
function funnyName(){
  let day;
  try { day = new Date().toLocaleDateString('en-US', {weekday:'long'}); }
  catch(e){ day = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()]; }
  return `${day} Americano`;
}
let focusName = false;
function newName(){ S.name = funnyName(); S.nameAuto = true; focusName = true; }
if(!S.tour && (!S.name || S.nameAuto !== false)) newName();

const touch = () => { S.tour.updated = Date.now(); };
let viewOnly = false, shared = null;
const cur = () => viewOnly ? shared : S.tour;
let sheet = null;
let addError = '';

function load(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const alpha = (x,y) => x.localeCompare(y, 'ro', {sensitivity:'base'});
const sortedRoster = () => S.roster.slice().sort((a,b)=>alpha(a.name,b.name));
const FX = () => S.mode === 'open' ? [] : S.fixed;
const byId = id => S.roster.find(p => p.id === id);

/* ---------- Tournament link ---------- */
const APP_URL = (() => {
  try { const h = location.hostname; if(/^https?:$/.test(location.protocol) && h && !/claude|anthropic/i.test(h)) return location.origin + location.pathname; } catch(e){}
  return 'https://claude.ai/artifact/9C8UsnUr6t5DpqaECSv3kS';
})();
function b64url(str){ const bytes = new TextEncoder().encode(str); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64url(code){ const b = atob(code.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((code.length+3)%4)); return new TextDecoder().decode(Uint8Array.from(b, c=>c.charCodeAt(0))); }
function encodeTour(t){
  const ids = Object.keys(t.players), ix = {}; ids.forEach((id,i)=>ix[id]=i);
  return b64url(JSON.stringify({v:1, n:t.name, d:t.created||Date.now(), m:t.mode==='open'?'o':undefined, p:t.points, c:t.courts,
    pl: ids.map(id=>[t.players[id].name, t.players[id].g]),
    f: (t.fixed||[]).map(x=>x.map(id=>ix[id])),
    r: t.rounds.map(rd=>rd.map(m=>[ix[m.a[0]],ix[m.a[1]],ix[m.b[0]],ix[m.b[1]],m.court,m.sa==null?-1:m.sa,m.sb==null?-1:m.sb]))}));
}
function decodeTour(code){
  const o = JSON.parse(unb64url(code));
  if(!o || o.v!==1 || !Array.isArray(o.pl) || !Array.isArray(o.r)) throw new Error('bad');
  const id = i => 'p'+i, players = {};
  o.pl.forEach(([n,g],i)=>players[id(i)] = {name:String(n), g: g==='F'?'F':'B'});
  return {id:'link-'+o.d, created:o.d, updated:o.d, name:String(o.n||'Americano mixt'), mode:o.m==='o'?'open':'mixed', points:+o.p||4, courts:(o.c||[]).map(String),
    players, fixed:(o.f||[]).map(x=>x.map(id)),
    rounds: o.r.map(rd=>rd.map(a=>({a:[id(a[0]),id(a[1])], b:[id(a[2]),id(a[3])], court:a[4], sa:a[5]<0?null:a[5], sb:a[6]<0?null:a[6]})))};
}
const tourLink = t => `${APP_URL}#t=${encodeTour(t)}`;
let setupNotice = false;
function setupLink(){
  const ix = {}; S.roster.forEach((p,i)=>ix[p.id]=i);
  const C = Math.max(1, Math.floor(S.roster.length/4));
  return `${APP_URL}#s=${b64url(JSON.stringify({v:1, n:S.name, m:S.mode==='open'?'o':undefined, p:S.points, c:courtNames(C), pl:S.roster.map(p=>[p.name,p.g]), f:S.fixed.map(t=>t.map(id=>ix[id]))}))}`;
}
function openSetupCode(code){
  try {
    const o = JSON.parse(unb64url(code));
    if(!o || o.v!==1 || !Array.isArray(o.pl)) return false;
    const ids = o.pl.map(()=>uid());
    S.roster = o.pl.map(([n,g],i)=>({id:ids[i], name:String(n), g:g==='F'?'F':'B'}));
    S.fixed = (o.f||[]).filter(t=>ids[t[0]]&&ids[t[1]]).map(t=>[ids[t[0]], ids[t[1]]]);
    if(o.n){ S.name = String(o.n); S.nameAuto = false; }
    S.mode = o.m==='o' ? 'open' : 'mixed';
    S.points = +o.p || 4; S.customPts = S.points !== 4;
    S.courts = (o.c||[]).map(String);
    viewOnly = false; shared = null; S.view = 'setup'; setupNotice = true; focusName = false;
    save(); return true;
  } catch(e){ return false; }
}
function openSharedCode(code){
  try { shared = decodeTour(code); viewOnly = true; S.view = 'rounds'; jumpToOpen = false; const open = shared.rounds.findIndex(rd => rd.some(m => m.sa == null)); S.round = open < 0 ? shared.rounds.length - 1 : open; S.mode = shared.mode === 'open' ? 'open' : 'mixed'; save(); return true; }
  catch(e){ return false; }
}
function clearHash(){ try { if(location.hash) history.replaceState(null, '', location.pathname + location.search); } catch(e){} }
(function(){
  const h = location.hash||'';
  const m = h.match(/[#&]t=([A-Za-z0-9_-]+)/); if(m){ openSharedCode(m[1]); return; }
  const k = h.match(/[#&]s=([A-Za-z0-9_-]+)/); if(k && openSetupCode(k[1])){ clearHash(); return; }
  if(/[#&]new\b/.test(h)){ viewOnly=false; shared=null; S.view = S.tour ? 'setup' : 'home'; if(!S.tour) newName(); save(); clearHash(); }
})();

/* ---------- Validation ---------- */
function analyze(){
  const n = S.roster.length;
  const fixedIds = new Set(FX().flat());
  const rot = S.roster.filter(p => !fixedIds.has(p.id));
  const b = rot.filter(p => p.g === 'B').length, f = rot.length - b;
  const errors = [];
  if(n < 4) errors.push('Adaugă cel puțin 4 jucători.');
  else if(n % 4){ const lo = n - n % 4; errors.push(`Ai ${n} jucători. Totalul trebuie să fie multiplu de 4, de exemplu ${lo} sau ${lo + 4}.`); }
  const open = S.mode === 'open', m = rot.length;
  if(!open && b !== f) errors.push(`În afara echipelor fixe sunt ${b} ${b===1?'băiat':'băieți'} și ${f} ${f===1?'fată':'fete'}. Trebuie să fie la fel de mulți.`);
  const rounds = open ? (m > 0 ? m - 1 : Math.max(1, FX().length - 1)) : (b > 0 ? b : Math.max(1, FX().length - 1));
  return {n, b, f, errors, courts: Math.floor(n/4), rounds, open};
}
function courtNames(C){ return Array.from({length:C}, (_,i) => (S.courts[i] && S.courts[i].trim()) || `Teren ${i+1}`); }

/* ---------- Schedule generation ---------- */
function* matchings(list){
  if(!list.length){ yield []; return; }
  const [f, ...rest] = list;
  for(let i=0;i<rest.length;i++){
    const rem = rest.filter((_,j) => j !== i);
    for(const m of matchings(rem)) yield [[f, rest[i]], ...m];
  }
}
function randomMatching(T){ const a = shuffle([...Array(T).keys()]); const m=[]; for(let i=0;i<T;i+=2) m.push([a[i],a[i+1]]); return m; }

// Whist designs: every player partners every other exactly once and faces every other exactly twice.
const WHIST = {
  8: [[[3,7],[2,0]],[[1,4],[5,6]]],
  12: [[[3,2],[5,9]],[[4,1],[0,6]],[[11,7],[10,8]]],
  16: [[[5,6],[10,3]],[[12,14],[13,8]],[[15,2],[9,0]],[[4,1],[7,11]]],
  20: [[[9,18],[15,17]],[[19,16],[7,11]],[[0,3],[5,6]],[[12,1],[8,13]],[[14,2],[4,10]]]
};
function generate(){
  const fixedIds = new Set(FX().flat());
  const rotB = S.roster.filter(p => !fixedIds.has(p.id) && p.g==='B').map(p=>p.id);
  const rotG = S.roster.filter(p => !fixedIds.has(p.id) && p.g==='F').map(p=>p.id);
  const ids = S.roster.map(p=>p.id), idx = {}; ids.forEach((id,i)=>idx[id]=i);
  const open = S.mode === 'open';
  const rotAll = S.roster.filter(p => !fixedIds.has(p.id)).map(p=>p.id);
  const n = ids.length, m = open ? rotAll.length : rotB.length, fixed = FX().map(t=>t.slice());
  let rounds;

  if(open && !fixed.length && WHIST[m]){
    const A = shuffle(rotAll.slice()), q = m - 1;
    const at = (x, r) => A[x === q ? q : (x + r) % q];
    rounds = shuffle([...Array(q).keys()]).map(r => shuffle(WHIST[m].map(([P,Q]) => ({a:P.map(x=>at(x,r)), b:Q.map(x=>at(x,r))}))));
  } else if(m === 0){
    const arr = shuffle(fixed.slice()); const T = arr.length; rounds = [];
    for(let r=0;r<T-1;r++){
      const rd=[]; for(let i=0;i<T/2;i++) rd.push({a:arr[i].slice(), b:arr[T-1-i].slice()});
      rounds.push(shuffle(rd)); arr.splice(1,0,arr.pop());
    }
  } else {
    const T = fixed.length + (open ? m/2 : m);
    const R = open ? m - 1 : m;
    const all = T <= 10 ? [...matchings([...Array(T).keys()])] : null;
    const restarts = T<=6 ? 400 : T<=8 ? 150 : T<=10 ? 40 : 20;
    let bestScore = Infinity;
    for(let s=0;s<restarts;s++){
      const opp = new Uint16Array(n*n);
      const B = shuffle(rotB.slice()), G = shuffle(rotG.slice()), A = shuffle(rotAll.slice());
      const order = shuffle([...Array(R).keys()]);
      const RT = order.map(r => {
        let pairs;
        if(open){
          const circ = [A[0], ...A.slice(1).map((_,i)=>A[1 + (i + r) % (m-1)])];
          pairs = []; for(let i=0;i<m/2;i++) pairs.push([circ[i], circ[m-1-i]]);
        } else pairs = B.map((b,i)=>[b, G[(i+r)%m]]);
        return [...fixed, ...pairs].map(t=>t.map(id=>idx[id]));
      });
      const addM = (ri, mt, d) => { const teams = RT[ri]; for(const [x,y] of mt) for(const a of teams[x]) for(const b of teams[y]){ opp[a*n+b]+=d; opp[b*n+a]+=d; } };
      const bestFor = ri => {
        const teams = RT[ri]; const cm = new Uint32Array(T*T);
        for(let x=0;x<T;x++) for(let y=x+1;y<T;y++){ let c=0; for(const a of teams[x]) for(const b of teams[y]) c+=opp[a*n+b]; cm[x*T+y]=c; }
        const cands = all || Array.from({length:1500}, () => randomMatching(T));
        let best=null, bc=Infinity, ties=0;
        for(const mt of cands){
          let c=0; for(const [x,y] of mt) c += x<y ? cm[x*T+y] : cm[y*T+x];
          if(c<bc){ bc=c; best=mt; ties=1; } else if(c===bc && Math.random()*(++ties)<1) best=mt;
        }
        return best;
      };
      const choice = [];
      for(let ri=0; ri<R; ri++){ choice[ri] = bestFor(ri); addM(ri, choice[ri], 1); }
      for(let pass=0; pass<6; pass++) for(let ri=0; ri<R; ri++){ addM(ri, choice[ri], -1); choice[ri] = bestFor(ri); addM(ri, choice[ri], 1); }
      const rs = RT.map((teams, ri) => shuffle(choice[ri].map(([x,y]) => ({a:teams[x].map(i=>ids[i]), b:teams[y].map(i=>ids[i])}))));
      let score=0; for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) score += opp[i*n+j]*opp[i*n+j];
      if(score < bestScore){ bestScore = score; rounds = rs; }
    }
  }
  rounds.forEach(rd => rd.forEach((mt,k) => { mt.court = k; mt.sa = null; mt.sb = null; }));
  const players = {}; S.roster.forEach(p => players[p.id] = {name:p.name, g:p.g});
  const C = n/4;
  const now = Date.now();
  return {id: uid(), created: now, updated: now, name: S.name.trim() || 'Americano mixt', mode: S.mode, points: S.points, courts: courtNames(C), players, fixed, rounds};
}

function reshuffle(t){
  const keep = {mode:S.mode, roster:S.roster, fixed:S.fixed, points:S.points, courts:S.courts, name:S.name};
  try {
    S.mode = t.mode === 'open' ? 'open' : 'mixed';
    S.roster = Object.keys(t.players).map(id => ({id, name:t.players[id].name, g:t.players[id].g}));
    S.fixed = (t.fixed||[]).map(x => x.slice()); S.points = t.points; S.courts = t.courts.slice(); S.name = t.name;
    const n = generate();
    n.id = t.id; n.created = t.created; n.name = t.name; n.courts = t.courts.slice();
    return n;
  } finally { Object.assign(S, keep); }
}

/* ---------- Views ---------- */
function render(){
  const fm = S.view === 'home' ? null : ((S.view === 'setup' || !cur()) ? S.mode : cur().mode);
  document.getElementById('title').textContent = fm ? (fm === 'open' ? 'Americano clasic' : 'Americano mixt') : 'Americano';
  const tabs = document.getElementById('tabs');
  tabs.hidden = !cur();
  const canBack = S.view === 'setup' && !cur();
  const canExit = !!cur() && S.view !== 'home';
  document.getElementById('back-btn').hidden = !canBack;
  document.getElementById('exit-btn').hidden = !canExit;
  document.getElementById('brand-ball').hidden = canBack || canExit;
  if(!cur() && (S.view==='rounds' || S.view==='board')) S.view = 'home';
  tabs.querySelectorAll('button').forEach(b => {
    b.hidden = (b.dataset.v==='rounds' || b.dataset.v==='board') ? !cur() : viewOnly;
    b.setAttribute('aria-current', b.dataset.v === S.view ? 'true' : 'false');
  });
  const app = document.getElementById('app');
  app.innerHTML = S.view === 'home' ? viewHome() : S.view === 'rounds' ? viewRounds() : S.view === 'board' ? viewBoard() : viewSetup();
  if(S.view === 'setup' && focusName){ focusName = false; const n = document.getElementById('tname'); if(n){ n.focus({preventScroll:true}); n.select(); } }
  if(S.view === 'rounds'){
    const chip = app.querySelector('.rchip[aria-current="true"]'), strip = app.querySelector('.round-strip');
    if(chip && strip) strip.scrollLeft = chip.offsetLeft - strip.offsetLeft - (strip.clientWidth - chip.offsetWidth) / 2;
    if(jumpToOpen){ jumpToOpen = false; const r = firstOpenRound(cur()); if(r > 0){ const sec = document.getElementById('round-'+r); if(sec) sec.scrollIntoView({block:'start'}); } }
  }
}

    h += `<section><h2>Terenuri</h2><div class="courts-in">${Array.from({length:a.courts},(_,i)=>`<input class="field" data-court="${i}" placeholder="Teren ${i+1}" value="${esc(S.courts[i]||`Teren ${i+1}`)}" aria-label="Numele terenului ${i+1}">`).join('')}</div></section>`;
  }

  const ok = !a.errors.length;
  h += `<div class="check ${ok?'':'bad'}">${ok
    ? `<p class="summary">${a.n} jucători, ${a.courts} ${a.courts===1?'teren':'terenuri'}, ${a.rounds} ${a.rounds===1?'rundă':'runde'}</p><p class="muted small">${a.open ? 'Fiecare jucător face echipă o dată cu fiecare dintre ceilalți' : 'Fiecare băiat joacă o dată cu fiecare fată'}, iar adversarii sunt distribuiți cât mai echilibrat.</p>`

}

function courtHTML(t, m){
  const nm = id => esc(t.players[id]?.name || '?');
  const has = m.sa != null;
  const ca = has ? (m.sa>m.sb?'won':m.sa<m.sb?'lost':'') : '';
  const cb = has ? (m.sb>m.sa?'won':m.sb<m.sa?'lost':'') : '';
  return `<div class="court">
        <div class="half a ${ca}"><div class="box"><span>${nm(m.a[0])}</span></div><div class="box"><span>${nm(m.a[1])}</span></div></div>
        <div class="net"></div>
        <div class="half b ${cb}"><div class="box"><span>${nm(m.b[0])}</span></div><div class="box"><span>${nm(m.b[1])}</span></div></div>
        <div class="score ${has?'':'empty'}">${has ? `${m.sa}–${m.sb}` : 'scor'}</div>
      </div>`;
}
function standings(t = S.tour){
  const st = {};
  Object.keys(t.players).forEach(id => st[id] = {id, pts:0, pl:0, w:0, d:0, diff:0});
  let done=0, total=0;
  t.rounds.forEach(rd => rd.forEach(m => {
    total++; if(m.sa == null) return; done++;
    const add = (ids, f, a) => ids.forEach(id => { const s=st[id]; s.pts+=f; s.pl++; s.diff+=f-a; if(f>a) s.w++; else if(f===a) s.d++; });
    add(m.a, m.sa, m.sb); add(m.b, m.sb, m.sa);
  }));
  const list = Object.values(st).sort((x,y)=> y.pts-x.pts || y.w-x.w || y.diff-x.diff);
  return {list, done, total};
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if(!el) return;
  const act = el.dataset.action;
  switch(act){
    case 'view': S.view = el.dataset.v; save(); window.scrollTo(0,0); if(S.view === 'rounds') jumpToOpen = true; render(); break;
    case 'mode': S.mode = el.dataset.v === 'open' ? 'open' : 'mixed'; save(); render(); break;
    case 'pick-format': S.mode = el.dataset.v === 'open' ? 'open' : 'mixed'; S.roster = []; S.fixed = []; S.courts = []; S.points = 4; S.customPts = false; editPts = false; ptsError = ''; fixPick = null; addError = ''; setupNotice = false; newName(); S.view = 'setup'; save(); try { history.pushState({v:'setup'}, ''); } catch(e){} render(); window.scrollTo(0,0); break;
    case 'back': goHome(); break;
    case 'home': goHome(); break;
    case 'pts': S.points = +el.dataset.v; S.customPts=false; editPts=false; ptsError=''; save(); render(); break;
    case 'pts-custom': ptsError=''; if(editPts){ editPts=false; render(); } else { editPts=true; render(); const i=document.getElementById('cpts'); if(i){ i.focus(); i.select(); } } break;
    case 'pts-ok': confirmPts(); break;
    case 'newg': S.newG = el.dataset.v; save(); render(); document.getElementById('pname')?.focus(); break;
    case 'add': addPlayer(); break;
    case 'suggest': { const name=el.dataset.name; if(!S.roster.some(p=>norm(p.name)===norm(name))){ S.roster.push({id:uid(), name, g:knownG(name)||S.newG}); addError=''; save(); render(); } break; }
    case 'pick': {
      const id=el.dataset.id;
      if(!fixPick) fixPick=id; else if(fixPick===id) fixPick=null; else { S.fixed.push([fixPick,id]); fixPick=null; save(); }
      render(); break;
    }
    case 'toggleg': { const p=byId(el.dataset.id); if(p){ p.g = p.g==='B'?'F':'B'; save(); render(); } break; }
    case 'remove': { const id=el.dataset.id; if(fixPick===id) fixPick=null; S.roster=S.roster.filter(p=>p.id!==id); S.fixed=S.fixed.filter(t=>!t.includes(id)); save(); render(); break; }
    case 'fix': {
      const a=document.getElementById('fx1')?.value, b=document.getElementById('fx2')?.value;
      if(a && b && a!==b){ S.fixed.push([a,b]); save(); render(); }
      break;
    }
    case 'unfix': S.fixed.splice(+el.dataset.i,1); save(); render(); break;
    case 'generate': {
      if(analyze().errors.length) return;
      const go = () => {
        setupNotice = false; viewOnly = false; shared = null; clearHash();
        const b = document.querySelector('[data-action="generate"]'); if(b){ b.disabled = true; b.textContent = 'Se generează…'; }
        setTimeout(() => { S.tour = generate(); S.name = funnyName(); S.nameAuto = true; S.round = 0; S.view='rounds'; save(); render(); window.scrollTo(0,0); }, 30);
      };
      if(S.tour) ask('Ai deja un turneu în desfășurare. Programul și scorurile lui vor fi înlocuite cu un program nou.', 'Generează meciurile', go, true); else go();
      break;
    }
    case 'end': ask('Începi un turneu nou? Turneul curent și scorurile lui se șterg de pe acest telefon, lista de jucători rămâne. Dacă vrei să-l păstrezi, trimite-ți întâi linkul lui.', 'Turneu nou', () => { S.tour=null; S.view='home'; newName(); save(); render(); window.scrollTo(0,0); }, true); break;
    case 'adopt': { const take = () => { S.mode = shared.mode === 'open' ? 'open' : 'mixed';
        const ids = Object.keys(shared.players);
        S.roster = ids.map(id => ({id, name: shared.players[id].name, g: shared.players[id].g}));
        S.fixed = (shared.fixed||[]).map(t => t.slice()); S.points = shared.points; S.customPts = shared.points !== 4; S.courts = shared.courts.slice();
        S.tour = shared; shared=null; viewOnly=false; clearHash(); S.view='rounds'; save(); render(); };
      if(S.tour) ask('Turneul tău de pe acest telefon va fi înlocuit cu cel primit.', 'Continuă turneul primit', take, true); else take(); break; }
    case 'leave-shared': shared=null; viewOnly=false; clearHash(); S.view = S.tour ? 'rounds' : 'home'; S.round=0; render(); window.scrollTo(0,0); break;
    case 'open-link': { const v=(document.getElementById('linkin')?.value||'').trim(); const m=v.match(/[#&]t=([A-Za-z0-9_-]+)/) || v.match(/^([A-Za-z0-9_-]{20,})$/); const k=v.match(/[#&]s=([A-Za-z0-9_-]+)/); if(m && openSharedCode(m[1])){ render(); window.scrollTo(0,0); } else if(k && openSetupCode(k[1])){ render(); window.scrollTo(0,0); } else { ask('Linkul nu conține un turneu. Copiază-l întreg, așa cum l-ai primit.', 'Am înțeles', null); } break; }
    case 'round': { const sec = document.getElementById('round-'+el.dataset.i); if(sec) sec.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); break; }
    case 'score': S.round = +el.dataset.r || 0; openSheet(+el.dataset.k); break;
    case 'step': setSide(el.dataset.s, sheet[el.dataset.s] + (+el.dataset.d)); break;
    case 'save-score': { const m=S.tour.rounds[S.round][sheet.k]; const wasDone = S.tour.rounds.every(rd => rd.every(x => x.sa != null)); m.sa=sheet.a; m.sb=sheet.b; touch(); save(); closeSheet(); render();
      if(!wasDone && S.tour.rounds.every(rd => rd.every(x => x.sa != null))){ const f = document.getElementById('finish'); if(f) f.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'center'}); }
      break; }
    case 'clear-score': { const m=S.tour.rounds[S.round][sheet.k]; m.sa=null; m.sb=null; touch(); save(); closeSheet(); render(); break; }
    case 'close': closeSheet(); break;
    case 'share': share(); break;
    case 'exit': {
      const leave = () => {
        if(viewOnly){ shared = null; viewOnly = false; clearHash(); }
        else { S.tour = null; }
        S.view = 'home'; S.round = 0; newName(); save(); render(); window.scrollTo(0,0);
      };
      const t = cur();
      if(!viewOnly && t && t.rounds.some(rd => rd.some(m => m.sa != null))) ask('Ieși din turneu? Programul și scorurile se șterg de pe acest telefon.', 'Ieși din turneu', leave, true);
      else leave();
      break;
    }
    case 'shuffle': {
      const t = S.tour; if(!t || viewOnly || t.rounds.some(rd => rd.some(m => m.sa != null))) break;
      S.tour = reshuffle(t); S.round = 0; save();
      justShuffled = true; render(); window.scrollTo(0,0);
      clearTimeout(shufTimer); shufTimer = setTimeout(() => { justShuffled = false; const bt = document.querySelector('.shuffle-btn'); if(bt) bt.classList.remove('done'); document.querySelectorAll('.match.shuf').forEach(m => m.classList.remove('shuf')); }, 500);
      break;
    }
    case 'toast-act': { const f = toastFn; hideToast(); if(f) f(); break; }
    case 'rules': openRules(); break;
    case 'copy': copyShare(el); break;
    case 'native-share': (async () => { try { await navigator.share({text:lastShare}); } catch(e){} })(); break;
    case 'confirm-ok': { const f = pendingOk; closeSheet(); if(f) f(); break; }
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.id==='tname'){ S.name=t.value; S.nameAuto=false; save(); }
  else if(t.id==='cpts'){ /* confirmed with OK */ }
  else if(t.dataset.court!=null){ S.courts[+t.dataset.court]=t.value; save(); }
  else if(t.dataset.s && sheet){ setSide(t.dataset.s, parseInt(t.value,10)); }
  else if(t.id==='pname'){ addError=''; const box=document.getElementById('sugg'); if(box) box.innerHTML=suggHTML(t.value); }
});
document.addEventListener('focusin', e => { if(e.target.dataset && e.target.dataset.court!=null) e.target.select(); });
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && e.target.id==='cpts'){ e.preventDefault(); confirmPts(); return; }
  if(e.key==='Enter' && e.target.id==='pname'){ e.preventDefault(); addPlayer(); }
  if(e.key==='Escape' && sheet) closeSheet();
  if(e.key==='Enter' && e.target.classList && e.target.classList.contains('hist')) e.target.click();
});

function goHome(){
  if(history.state && history.state.v === 'setup'){ try { history.back(); return; } catch(e){} }
  closeSheet(); S.view = 'home'; save(); render(); window.scrollTo(0,0);
}
window.addEventListener('popstate', () => {
  if(document.getElementById('sheet').hidden === false){ closeSheet(); }
  if(S.view === 'setup' && !S.tour && !viewOnly){ S.view = 'home'; save(); render(); window.scrollTo(0,0); }
});
render();
})();
</script>
</body>
</html>
